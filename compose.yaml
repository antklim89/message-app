services:
  app:
    image: app
    build:
      context: .
      dockerfile: ./Dockerfile
      secrets:
        - VITE_SUPABASE_ANON_KEY
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    ports:
      - 3000:80

secrets:
  VITE_SUPABASE_ANON_KEY:
    environment: VITE_SUPABASE_ANON_KEY